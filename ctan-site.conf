<VirtualHost *:80>
    DocumentRoot /var/www/html/tex-archive

    <Directory /var/www/html/tex-archive>
        Options +Indexes +FollowSymLinks -ExecCGI -Includes -IncludesNOEXEC
        AllowOverride None
        Require all granted
        
        # CTAN prefers directory listings enabled
        IndexOptions FancyIndexing NameWidth=* DescriptionWidth=*
        
        # HTTPS redirect header (Traefik handles actual HTTPS)
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/ctan-error.log
    CustomLog ${APACHE_LOG_DIR}/ctan-access.log combined
</VirtualHost>
